<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' ares-plugin:; style-src 'self' ares-plugin:; img-src 'self' ares-plugin:; connect-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ares Workbench</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div><small>ARES / EXPERIMENT</small><h1>Native canvas</h1></div><span id="badge">C++ → WebGL</span></header>
  <nav>
    <select id="system" aria-label="Emulator system"><option value="">Auto-detect system</option></select><button id="open">Open ROM</button><button id="settings">Use ares settings…</button><button id="pause">Pause</button><button id="reset">Reset</button>
    <button id="synthetic">640 × 480 test</button><button id="hd">1080p test</button>
  </nav>
  <main>
    <section id="viewport"><canvas id="screen" width="640" height="480" tabindex="0" aria-label="Emulator display"></canvas></section>
    <aside>
      <h2>Presentation</h2>
      <label>Theme<select id="theme"><option value="dark">Midnight</option><option value="paper">Paper</option><option value="green">Terminal</option></select></label>
      <label>Scaling<select id="scale"><option value="fit">Best fit</option><option value="integer">Integer</option></select></label>
      <label><input type="checkbox" id="scanlines"> Scanlines</label>
      <label><input type="checkbox" id="left"> Panel on left</label>
      <h2>Native settings</h2><div id="native-settings"></div>
      <button id="stress">Block UI for 250 ms</button>
      <h2>Live measurements</h2><pre id="metrics">Waiting for frames…</pre>
      <p id="controls">Open a ROM to see its controls.</p>
      <p>Audio runs in the native host. This canvas receives raw pixels.</p>
    </aside>
  </main>
  <footer id="status">Starting native host…</footer>
  <script type="module" src="dist/browser/renderer.js"></script>
  <script type="module" src="dist/browser/plugins/runtime.js"></script>
</body>
</html>
